/* ---------- standards mastery ---------- */
function cutoffs(){ const met = +SETTINGS.met || 80, ap = Math.min(+SETTINGS.approach || 60, met); return {met, ap}; }
function band(pct){ const c = cutoffs(); return pct >= c.met ? "met" : pct >= c.ap ? "approach" : "notyet"; }
const BAND_LABEL = {met:"Met", approach:"Approaching", notyet:"Not yet"};
function stdFor(a, q, keyMap){ return (keyMap.get(String(q.q))||{}).std || (q.standard||"").trim() || (a.defaultStd||"").trim() || "Untagged"; }
/* Map standard -> {e, p, n} for one student's result; unclear answers are left out until reviewed */
function stdScores(a, st, keyMap){
  const m = new Map();
  (st.result?.questions || []).forEach(q=>{
    if (q.result === "unclear") return;
    const s = stdFor(a, q, keyMap), o = m.get(s) || {e:0, p:0, n:0};
    o.e += +q.points_earned || 0; o.p += +q.points_possible || 0; o.n++; m.set(s, o);
  });
  return m;
}
const pctOf = o => o.p ? Math.round(o.e / o.p * 100) : 0;
function standardsHTML(a){
  const keyMap = parseKey(a.keyText), graded = a.students.filter(s=>s.result);
  const per = graded.map(st=>({st, m:stdScores(a, st, keyMap)}));
  const stds = [...new Set(per.flatMap(x=>[...x.m.keys()]))].sort();
  if (!stds.length) return "";
  const onlyUntagged = stds.length === 1 && stds[0] === "Untagged";
  const rows = stds.map(s=>{
    const groups = {met:[], approach:[], notyet:[]}; let e = 0, p = 0, nq = 0;
    per.forEach(({st, m})=>{ const o = m.get(s); if (!o) return; e += o.e; p += o.p; nq = Math.max(nq, o.n); groups[band(pctOf(o))].push({name: st.name || "Student", pct: pctOf(o)}); });
    const classPct = p ? Math.round(e / p * 100) : 0, cls = band(classPct);
    return `<tr><td><b>${esc(s)}</b><div class="muted-s">${nq} question${nq===1?"":"s"}</div></td>
      <td class="num">${classPct}%</td><td><span class="band ${cls}">${BAND_LABEL[cls]}</span></td>
      <td>${["met","approach","notyet"].map(b=>groups[b].length ? `<div class="grp-line"><span class="band ${b}">${BAND_LABEL[b]} · ${groups[b].length}</span> ${groups[b].map(x=>`<span class="kid">${esc(x.name)} <small>${x.pct}%</small></span>`).join(" ")}</div>` : "").join("")}</td></tr>`;
  }).join("");
  const c = cutoffs();
  return `<div class="std-block">
    <div class="lab" style="margin-bottom:6px">Standards mastery <span class="hint">Met ≥ ${c.met}% · Approaching ≥ ${c.ap}% · change the cutoffs in Settings</span></div>
    ${onlyUntagged ? `<div class="note">Tag questions with a standard to see mastery by standard. In the answer key, add it in brackets: <code class="kbd">3) 1.56 [5.NBT.B.7]</code>, or fill in "Standard for untagged questions".</div>` : ""}
    <div class="qtable-wrap"><table class="qtable"><thead><tr><th>Standard</th><th>Class</th><th>Status</th><th>Students (Approaching and Not yet are your reteach groups)</th></tr></thead><tbody>${rows}</tbody></table></div>
  </div>`;
}
function stdChips(a, st){
  const m = stdScores(a, st, parseKey(a.keyText));
  if (!m.size || (m.size === 1 && m.has("Untagged"))) return "";
  return `<div class="chips">${[...m.entries()].sort().map(([s,o])=>{ const p = pctOf(o); return `<span class="band ${band(p)}" title="${o.e} of ${o.p} points">${esc(s)}: ${p}%</span>`; }).join("")}</div>`;
}
function exportStdCSV(a){
  const keyMap = parseKey(a.keyText), graded = a.students.filter(s=>s.result);
  const per = graded.map(st=>({st, m:stdScores(a, st, keyMap)}));
  const stds = [...new Set(per.flatMap(x=>[...x.m.keys()]))].sort();
  const rows = [["Student", ...stds.flatMap(s=>[s + " %", s + " status"])]];
  per.forEach(({st, m})=>rows.push([st.name, ...stds.flatMap(s=>{ const o = m.get(s); return o ? [pctOf(o), BAND_LABEL[band(pctOf(o))]] : ["",""]; })]));
  saveCSV(rows, fileBase({title:a.name}) + "_standards.csv");
}
function saveCSV(rows, filename){
  const csv = rows.map(r=>r.map(v=>{ v = String(v ?? ""); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }).join(",")).join("\r\n");
  S.downloads.save({filename, data: new Blob(["﻿" + csv], {type:"text/csv"})}).catch(()=>{});
}

/* ---------- Data view: standards across every graded assignment ---------- */
const D = {subject:"all", grade:"all"};
const dView = document.getElementById("dataView");
function dataModel(){
  const students = new Map(), stds = new Map(), tests = [];
  gSorted().reverse().forEach(([id, a])=>{
    if (D.subject !== "all" && a.subject !== D.subject) return;
    if (D.grade !== "all" && a.grade !== D.grade) return;
    const graded = a.students.filter(s=>s.result); if (!graded.length) return;
    tests.push(a.name || "Untitled");
    const keyMap = parseKey(a.keyText);
    graded.forEach(st=>{
      const k = (st.name || "").trim().toLowerCase() || st.id;
      const row = students.get(k) || {name: (st.name||"Student").trim(), cells:new Map()};
      stdScores(a, st, keyMap).forEach((o, s)=>{
        if (s === "Untagged") return;
        const c = row.cells.get(s) || {e:0, p:0, tests:[]}; c.e += o.e; c.p += o.p; c.tests.push(`${a.name}: ${pctOf(o)}%`); row.cells.set(s, c);
        stds.set(s, (stds.get(s)||0) + 1);
      });
      students.set(k, row);
    });
  });
  return {students:[...students.values()].sort((x,y)=>x.name.localeCompare(y.name)), stds:[...stds.keys()].sort(), tests};
}
function renderData(){
  const t = THEMES[D.subject] || THEMES.math, r = document.documentElement.style;
  r.setProperty("--t-dark","#"+t.dark); r.setProperty("--t-mid","#"+t.mid); r.setProperty("--t-light","#"+t.light); r.setProperty("--t-border","#"+t.border);
  const md = dataModel(), c = cutoffs();
  const filters = `<div class="actions">
      <label class="grade-pick"><span>Subject</span><select id="d-subject">${[["all","All subjects"],...Object.entries(THEMES).map(([k,v])=>[k,v.name])].map(([k,n])=>`<option value="${k}"${D.subject===k?" selected":""}>${esc(n)}</option>`).join("")}</select></label>
      <label class="grade-pick"><span>Grade</span><select id="d-grade"><option value="all">All</option>${GRADES.map(g=>`<option value="${g}"${D.grade===g?" selected":""}>${g}</option>`).join("")}</select></label>
      ${md.stds.length ? `<button class="btn" type="button" data-dact="csv">${icon("sheet")} Download CSV</button>` : ""}
    </div>`;
  if (!md.stds.length){
    dView.innerHTML = `<div class="set-wrap" style="max-width:none"><section class="card"><div class="ph-row"><h2 style="font-size:22px">Standards data</h2>${filters}</div>
      <div class="empty-state" style="border:0;padding:24px 8px"><p>No tagged, graded questions yet. In Grade work, tag each answer-key line with its standard, like <code class="kbd">3) 1.56 [5.NBT.B.7]</code>, and grade some papers. This page then shows every student's mastery of every standard across all your tests.</p></div></section></div>`;
    return;
  }
  const colStats = md.stds.map(s=>{ let e = 0, p = 0, met = 0, n = 0; md.students.forEach(row=>{ const cl = row.cells.get(s); if (!cl) return; e += cl.e; p += cl.p; n++; if (band(pctOf(cl)) === "met") met++; }); return {s, pct: p ? Math.round(e/p*100) : 0, met, n}; });
  const needs = colStats.filter(x=>band(x.pct) !== "met").sort((x,y)=>x.pct-y.pct);
  dView.innerHTML = `<div class="set-wrap" style="max-width:none">
  <section class="card">
    <div class="ph-row"><h2 style="font-size:22px">Standards data</h2>${filters}</div>
    <p class="card-sub">From ${md.tests.length} graded assignment${md.tests.length===1?"":"s"}. Each cell combines every question on that standard. Met ≥ ${c.met}%, Approaching ≥ ${c.ap}%. Students are matched by name across assignments.</p>
    <div class="summary">
      <div class="stat"><div class="k">Students</div><div class="v">${md.students.length}</div></div>
      <div class="stat"><div class="k">Standards assessed</div><div class="v">${md.stds.length}</div></div>
      <div class="stat"><div class="k">Standards met by class</div><div class="v">${colStats.filter(x=>band(x.pct)==="met").length}<span style="font-size:15px;color:var(--muted)"> / ${md.stds.length}</span></div></div>
    </div>
    ${needs.length ? `<div><div class="lab" style="margin-bottom:6px">Standards to reteach as a class</div><div class="chips">${needs.map(x=>`<span class="band ${band(x.pct)}">${esc(x.s)}: ${x.pct}%</span>`).join("")}</div></div>` : `<div class="note">The class has met every assessed standard.</div>`}
  </section>
  <section class="card">
    <h2>Student × standard</h2>
    <div class="matrix-wrap"><table class="matrix"><thead><tr><th>Student</th>${colStats.map(x=>`<th title="Class ${x.pct}% · ${x.met} of ${x.n} met">${esc(x.s)}<div class="muted-s">${x.pct}% · ${x.met}/${x.n} met</div></th>`).join("")}</tr></thead>
    <tbody>${md.students.map(row=>`<tr><th>${esc(row.name)}</th>${md.stds.map(s=>{ const cl = row.cells.get(s); if (!cl) return `<td class="na">–</td>`; const p = pctOf(cl); return `<td class="cell ${band(p)}" title="${esc(cl.tests.join("\n"))}">${p}%</td>`; }).join("")}</tr>`).join("")}</tbody></table></div>
  </section>
  <section class="card">
    <h2>Reteach groups</h2>
    <div class="grp-grid">${colStats.map(x=>{
      const ap = [], ny = [];
      md.students.forEach(row=>{ const cl = row.cells.get(x.s); if (!cl) return; const b = band(pctOf(cl)); if (b === "approach") ap.push(row.name); if (b === "notyet") ny.push(row.name); });
      return `<div class="grp-card"><b>${esc(x.s)}</b>
        <div class="grp-line"><span class="band notyet">Not yet · ${ny.length}</span> ${ny.map(n=>`<span class="kid">${esc(n)}</span>`).join(" ") || '<span class="muted-s">none</span>'}</div>
        <div class="grp-line"><span class="band approach">Approaching · ${ap.length}</span> ${ap.map(n=>`<span class="kid">${esc(n)}</span>`).join(" ") || '<span class="muted-s">none</span>'}</div></div>`;
    }).join("")}</div>
  </section></div>`;
}
dView.addEventListener("change", e=>{
  if (e.target.id === "d-subject"){ D.subject = e.target.value; renderData(); }
  if (e.target.id === "d-grade"){ D.grade = e.target.value; renderData(); }
});
dView.addEventListener("click", e=>{
  if (e.target.closest("[data-dact=csv]")){
    const md = dataModel();
    const rows = [["Student", ...md.stds]];
    md.students.forEach(row=>rows.push([row.name, ...md.stds.map(s=>{ const cl = row.cells.get(s); return cl ? pctOf(cl) + "% " + BAND_LABEL[band(pctOf(cl))] : ""; })]));
    saveCSV(rows, "standards_data.csv");
  }
});

/* ---------- navigation ---------- */
function showView(v){
  if (!["plans","grade","data","settings"].includes(v)) v = "plans";
  $("#plansView").hidden = v !== "plans"; $("#gradeView").hidden = v !== "grade"; sView.hidden = v !== "settings"; dView.hidden = v !== "data";
  document.querySelectorAll(".topnav [data-nav]").forEach(b=>b.setAttribute("aria-current", b.dataset.nav === v ? "page" : "false"));
  if (v === "plans") renderMain(); else if (v === "grade") renderGrade(); else if (v === "data") renderData(); else { S.setMsg = null; renderSettings(); }
  try { history.replaceState(null, "", v === "plans" ? location.pathname + location.search : "#" + v); } catch(e){}
}
document.addEventListener("click", e=>{ const n = e.target.closest("[data-nav]"); if (n && n.tagName === "BUTTON" && !n.closest(".view-toggle")){ showView(n.dataset.nav); window.scrollTo(0,0); } });
gLoad(); G.cur = gSorted()[0]?.[0] || null;

/* ---------- boot ---------- */
let unsub = null;
function startDb(db){
  S.db = db; S.mode = "db";
  let first = true;
  unsub = db.collection("plans").onSnapshot(snap=>{
    const seen = new Set();
    snap.docs.forEach(doc=>{
      seen.add(doc.id);
      if (S.dirty.has(doc.id)) return;
      S.plans.set(doc.id, normalize(doc.data()));
    });
    [...S.plans.keys()].forEach(id=>{ if (!seen.has(id) && !S.dirty.has(id)) S.plans.delete(id); });
    if (first){
      first = false;
      if (!S.cur || !S.plans.has(S.cur)) S.cur = sortedPlans()[0]?.[0] || null;
      setStatus("saved","All changes saved");
      renderMain(); return;
    }
    if (S.cur && !S.plans.has(S.cur)) { S.cur = sortedPlans()[0]?.[0] || null; S.day = 0; renderMain(); return; }
    const ae = document.activeElement;
    if (ae && main.contains(ae) && /INPUT|TEXTAREA/.test(ae.tagName)) renderList();
    else renderMain();
  }, err=>{
    setStatus("error","Lost the connection to your saved plans. Reload to reconnect.");
  });
}
function startLocal(){
  S.mode = "local"; lsRead();
  S.cur = sortedPlans()[0]?.[0] || null;
  setStatus("local","Saved in this browser");
  renderMain();
}

renderMain();
if (window.claude && typeof window.claude.use === "function"){
  Promise.all([
    window.claude.use("db").catch(()=>null),
    window.claude.use("downloads").catch(()=>null),
    window.claude.use("sample").catch(()=>null)
  ]).then(([db, dl, sm])=>{
    S.downloads = dl; S.sample = sm;
    if (db) startDb(db); else startLocal();
  });
} else {
  S.downloads = browserDownloads;
  startLocal();
}
if (/^#(grade|data|settings)$/.test(location.hash)) showView(location.hash.slice(1));
})();
</script>
